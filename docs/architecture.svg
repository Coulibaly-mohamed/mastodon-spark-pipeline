<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4255"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B34A17"/>
    </marker>
  </defs>

  <rect width="1600" height="860" fill="#F5F4EF"/>

  <!-- Titre -->
  <text x="40" y="58" font-size="34" font-weight="700" fill="#141B2D">Architecture du pipeline Mastodon × Apache Spark</text>
  <text x="40" y="92" font-size="20" fill="#5A6275">Ingestion temps réel · traitement streaming et batch · sentiment MLlib · visualisation</text>

  <!-- Zone Docker -->
  <rect x="300" y="125" width="1265" height="700" rx="22" fill="none" stroke="#8C97AD" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="324" y="158" font-size="18" font-weight="700" fill="#5A6275">DOCKER COMPOSE · 6 services</text>

  <!-- ===== Ligne 1 : temps réel ===== -->
  <!-- Mastodon -->
  <rect x="40" y="215" width="210" height="130" rx="16" fill="#FFFFFF" stroke="#C9C5B9" stroke-width="2"/>
  <text x="145" y="265" font-size="24" font-weight="700" fill="#141B2D" text-anchor="middle">Mastodon</text>
  <text x="145" y="295" font-size="17" fill="#5A6275" text-anchor="middle">API publique</text>
  <text x="145" y="320" font-size="17" fill="#5A6275" text-anchor="middle">flux par hashtag</text>

  <!-- Producer -->
  <rect x="340" y="215" width="210" height="130" rx="16" fill="#FFFFFF" stroke="#C9C5B9" stroke-width="2"/>
  <text x="445" y="265" font-size="24" font-weight="700" fill="#141B2D" text-anchor="middle">Producer</text>
  <text x="445" y="295" font-size="17" fill="#5A6275" text-anchor="middle">Python · Mastodon.py</text>
  <text x="445" y="320" font-size="17" fill="#5A6275" text-anchor="middle">polling toutes les 15 s</text>

  <!-- Kafka -->
  <rect x="630" y="215" width="210" height="130" rx="16" fill="#FFFFFF" stroke="#E8692E" stroke-width="3"/>
  <text x="735" y="265" font-size="24" font-weight="700" fill="#141B2D" text-anchor="middle">Apache Kafka</text>
  <text x="735" y="295" font-size="17" fill="#5A6275" text-anchor="middle">topic « toots »</text>
  <text x="735" y="320" font-size="17" fill="#5A6275" text-anchor="middle">3 partitions · KRaft</text>

  <!-- Spark Streaming -->
  <rect x="920" y="200" width="290" height="160" rx="16" fill="#141B2D"/>
  <text x="1065" y="245" font-size="24" font-weight="700" fill="#F5F4EF" text-anchor="middle">Spark Structured</text>
  <text x="1065" y="273" font-size="24" font-weight="700" fill="#F5F4EF" text-anchor="middle">Streaming</text>
  <text x="1065" y="305" font-size="17" fill="#B8C2D6" text-anchor="middle">nettoyage · filtre langue</text>
  <text x="1065" y="330" font-size="17" fill="#B8C2D6" text-anchor="middle">sentiment · fenêtres 5 min</text>

  <!-- PostgreSQL -->
  <rect x="1290" y="200" width="240" height="160" rx="16" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="3"/>
  <text x="1410" y="245" font-size="24" font-weight="700" fill="#141B2D" text-anchor="middle">PostgreSQL</text>
  <text x="1410" y="277" font-size="17" fill="#5A6275" text-anchor="middle">toots</text>
  <text x="1410" y="301" font-size="17" fill="#5A6275" text-anchor="middle">sentiment_window</text>
  <text x="1410" y="325" font-size="17" fill="#5A6275" text-anchor="middle">hashtag_window</text>

  <!-- Flèches ligne 1 -->
  <line x1="250" y1="280" x2="334" y2="280" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>
  <text x="270" y="266" font-size="15" fill="#5A6275" text-anchor="middle">API</text>
  <line x1="550" y1="280" x2="624" y2="280" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>
  <text x="587" y="266" font-size="15" fill="#5A6275" text-anchor="middle">JSON</text>
  <line x1="840" y1="280" x2="914" y2="280" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>
  <text x="877" y="266" font-size="15" fill="#5A6275" text-anchor="middle">30 s</text>
  <line x1="1210" y1="280" x2="1284" y2="280" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1247" y="266" font-size="15" fill="#5A6275" text-anchor="middle">JDBC</text>

  <!-- ===== Ligne 2 : machine learning ===== -->
  <rect x="340" y="470" width="210" height="130" rx="16" fill="#FBE9DF" stroke="#E8692E" stroke-width="2"/>
  <text x="445" y="520" font-size="24" font-weight="700" fill="#141B2D" text-anchor="middle">Sentiment140</text>
  <text x="445" y="550" font-size="17" fill="#5A6275" text-anchor="middle">1,6 M tweets</text>
  <text x="445" y="575" font-size="17" fill="#5A6275" text-anchor="middle">labellisés +/−</text>

  <rect x="630" y="470" width="290" height="130" rx="16" fill="#141B2D"/>
  <text x="775" y="515" font-size="24" font-weight="700" fill="#F5F4EF" text-anchor="middle">Spark MLlib</text>
  <text x="775" y="547" font-size="17" fill="#B8C2D6" text-anchor="middle">TF-IDF + régression logistique</text>
  <text x="775" y="572" font-size="17" fill="#B8C2D6" text-anchor="middle">entraînement (80/20)</text>

  <line x1="550" y1="535" x2="624" y2="535" stroke="#B34A17" stroke-width="3" marker-end="url(#arrO)"/>
  <!-- modèle -> streaming -->
  <path d="M 920 535 L 1065 535 L 1065 366" fill="none" stroke="#B34A17" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="1080" y="455" font-size="17" font-weight="700" fill="#B34A17">PipelineModel</text>
  <text x="1080" y="478" font-size="15" fill="#5A6275">chargé au démarrage</text>

  <!-- ===== Colonne droite : batch + visualisation ===== -->
  <rect x="1290" y="470" width="240" height="130" rx="16" fill="#141B2D"/>
  <text x="1410" y="515" font-size="24" font-weight="700" fill="#F5F4EF" text-anchor="middle">Spark Batch</text>
  <text x="1410" y="547" font-size="17" fill="#B8C2D6" text-anchor="middle">Spark SQL sur l'historique</text>
  <text x="1410" y="572" font-size="17" fill="#B8C2D6" text-anchor="middle">→ tables batch_*</text>

  <rect x="1290" y="670" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#C9C5B9" stroke-width="2"/>
  <text x="1410" y="715" font-size="24" font-weight="700" fill="#141B2D" text-anchor="middle">Jupyter</text>
  <text x="1410" y="745" font-size="17" fill="#5A6275" text-anchor="middle">Matplotlib · Seaborn</text>
  <text x="1410" y="769" font-size="17" fill="#5A6275" text-anchor="middle">graphiques et insights</text>

  <!-- Postgres <-> Batch (lecture / écriture) -->
  <line x1="1380" y1="360" x2="1380" y2="464" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="1440" y1="470" x2="1440" y2="366" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1370" y="420" font-size="15" fill="#5A6275" text-anchor="end">lecture</text>
  <text x="1450" y="420" font-size="15" fill="#5A6275">écriture</text>
  <line x1="1410" y1="600" x2="1410" y2="664" stroke="#3A4255" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Supervision -->
  <rect x="340" y="680" width="580" height="110" rx="16" fill="#FFFFFF" stroke="#C9C5B9" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="365" y="718" font-size="20" font-weight="700" fill="#141B2D">Supervision</text>
  <text x="365" y="748" font-size="17" fill="#5A6275">Kafka UI :8080 · Spark UI :4040 · Jupyter :8888</text>
  <text x="365" y="772" font-size="17" fill="#5A6275">Checkpoints Spark : reprise exacte · écriture idempotente</text>

  <!-- Légende -->
  <rect x="40" y="680" width="22" height="22" rx="4" fill="#141B2D"/>
  <text x="72" y="698" font-size="16" fill="#3A4255">traitement Spark</text>
  <line x1="40" y1="735" x2="64" y2="735" stroke="#3A4255" stroke-width="3"/>
  <text x="72" y="741" font-size="16" fill="#3A4255">flux de données</text>
  <line x1="40" y1="772" x2="64" y2="772" stroke="#B34A17" stroke-width="3"/>
  <text x="72" y="778" font-size="16" fill="#3A4255">machine learning</text>
</svg>
