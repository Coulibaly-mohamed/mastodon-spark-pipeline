name: mastodon-spark

services:

  # ---------------------------------------------------------------- Kafka (KRaft, sans Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"            # accès depuis Windows (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crée le topic au démarrage (one-shot)
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ${KAFKA_TOPIC:-toots} --partitions 3 --replication-factor 1 &&
        echo "Topic ${KAFKA_TOPIC:-toots} prêt"
    restart: "no"

  # Interface web Kafka : http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"   # 5433 côté Windows (évite le conflit avec un Postgres existant)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mastodon}
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spark} -d ${POSTGRES_DB:-mastodon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- Producer Mastodon -> Kafka
  producer:
    build: ./producer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure:5

  # ---------------------------------------------------------------- Jupyter + PySpark
  jupyter:
    build: ./docker/jupyter
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CHECKPOINT_DIR: /home/jovyan/checkpoints
    working_dir: /home/jovyan/work
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI (1er job)
      - "4041:4041"   # Spark UI (2e job en parallèle)
    volumes:
      - ./:/home/jovyan/work
      - ivy_cache:/home/jovyan/.ivy2
      - spark_checkpoints:/home/jovyan/checkpoints
    mem_limit: 7g
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  pg_data:
  ivy_cache:
  spark_checkpoints:
